<!doctype html>
<html lang="ko" class="page-admin">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>관리자 · Playlist Player</title>
    <meta name="theme-color" content="#0f0f0f" />
    <link rel="stylesheet" href="styles.css?v=20260830fix133" />
  </head>
  <body class="page-admin">
    <div class="admin-page">
      <header class="admin-header">
        <h1>이용 코드 관리</h1>
        <a class="btn-text" href="./">앱으로</a>
      </header>

      <div id="adminGate" class="gate-card admin-gate">
        <p id="adminGateMsg">확인 중…</p>
        <button class="btn-primary btn-block btn-google-settings hidden" id="adminLoginBtn" type="button">
          <svg class="icon-google" aria-hidden="true"><use href="#icons/icon-google"/></svg>
          <span>Google 로그인</span>
        </button>
      </div>

      <main id="adminMain" class="admin-main hidden">
        <section class="settings-card admin-create">
          <h2>코드 생성</h2>
          <label class="admin-unlimited">
            <input type="checkbox" id="createUnlimited" />
            <span>기간 무한</span>
          </label>
          <label class="field-label" for="createDays">이용 기간</label>
          <div class="admin-create-duration" id="createDurationFields">
            <input class="field-input" id="createDays" type="number" min="0" max="3650" value="30" aria-label="일" />
            <span class="admin-unit-label">일</span>
            <input class="field-input" id="createHours" type="number" min="0" max="23" value="0" aria-label="시간" />
            <span class="admin-unit-label">시간</span>
          </div>
          <button class="btn-primary btn-block" id="btnCreateCode" type="button">무작위 코드 생성</button>
          <p class="settings-note" id="createResult"></p>
        </section>

        <section class="admin-list-wrap">
          <h2>코드 목록</h2>
          <div id="codesList" class="admin-codes-list"></div>
        </section>

        <section class="admin-list-wrap admin-feedback-wrap">
          <div class="admin-section-head">
            <h2>피드백 수신함</h2>
            <button class="btn-text" id="btnRefreshFeedback" type="button">새로고침</button>
          </div>
          <div id="feedbackList" class="admin-feedback-list"></div>
        </section>
      </main>
    </div>

    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
      <symbol id="icons/icon-google" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></symbol>
    </svg>

    <script type="module" src="js/admin.js?v=20261109fix166"></script>
  </body>
</html>
