<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101010" />
    <title>영상 시청 · Playlist Player</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="watch.css?v=20260830fix134" />
  </head>
  <body>
    <header class="watch-header">
      <a class="watch-brand" href="./" aria-label="Playlist Player로 돌아가기">
        <span class="watch-brand-mark" aria-hidden="true">P</span>
        <span>Playlist Player</span>
      </a>

      <form class="watch-search" id="watchSearch" role="search">
        <label class="sr-only" for="watchUrl">YouTube 검색, URL 또는 영상 ID</label>
        <input id="watchUrl" type="search" autocomplete="off" spellcheck="false" placeholder="YouTube 검색" />
        <button type="submit" aria-label="검색" title="검색">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3a6.5 6.5 0 1 0 4.23 11.43l5 4.99 1.41-1.41-4.99-5A6.5 6.5 0 0 0 9.5 3Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/></svg>
        </button>
      </form>

      <a class="watch-back" href="./">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg>
        <span>플레이어</span>
      </a>
    </header>

    <main class="watch-layout">
      <section class="watch-primary" aria-label="영상">
        <div class="watch-player-shell" id="watchPlayerShell">
          <div id="watchPlayer"></div>
          <div class="watch-empty" id="watchEmpty">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg>
            <strong>시청할 영상을 선택하세요</strong>
            <span>위 검색창에 YouTube 주소를 붙여 넣을 수도 있습니다.</span>
          </div>
        </div>

        <div class="watch-meta">
          <h1 id="watchTitle">영상 시청</h1>
          <div class="watch-meta-row">
            <div class="watch-channel">
              <span class="watch-channel-avatar" id="watchChannelAvatar" aria-hidden="true"></span>
              <div>
                <strong id="watchChannel">Playlist Player</strong>
                <span id="watchQueueLabel">재생목록에서 영상을 선택하세요</span>
              </div>
            </div>
            <div class="watch-actions">
              <button id="copyWatchLink" type="button" title="링크 복사" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z"/></svg>
                <span>링크 복사</span>
              </button>
              <a id="openYoutube" href="https://www.youtube.com/" target="_blank" rel="noopener" aria-disabled="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12l-6.2 3.6Z"/></svg>
                <span>YouTube에서 보기</span>
              </a>
            </div>
          </div>
        </div>
      </section>

      <section class="watch-search-results" id="watchSearchResults" aria-labelledby="watchSearchHeading" hidden>
        <header class="watch-results-header">
          <div>
            <p>검색 결과</p>
            <h2 id="watchSearchHeading">YouTube</h2>
          </div>
          <button id="closeWatchSearch" type="button" title="검색 결과 닫기" aria-label="검색 결과 닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m19 6.41-1.41-1.42L12 10.59 6.41 4.99 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z"/></svg>
          </button>
        </header>
        <p class="watch-results-status" id="watchSearchStatus" role="status" aria-live="polite"></p>
        <div class="watch-results-grid" id="watchSearchGrid"></div>
        <button class="watch-results-more" id="watchSearchMore" type="button" hidden>더 보기</button>
      </section>

      <aside class="watch-queue" aria-label="다음 영상">
        <div class="watch-queue-header">
          <div>
            <p>재생목록</p>
            <h2 id="watchPlaylistName">다음 영상</h2>
          </div>
          <span id="watchQueueCount">0개</span>
        </div>
        <ol id="watchQueueList"></ol>
        <p class="watch-queue-empty" id="watchQueueEmpty">현재 재생목록이 없습니다.</p>
      </aside>
    </main>

    <div class="watch-toast" id="watchToast" role="status" aria-live="polite"></div>
    <script type="module" src="js/watch.js?v=20261109fix169"></script>
  </body>
</html>
